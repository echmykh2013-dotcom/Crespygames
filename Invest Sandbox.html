<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invest Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14212b;--mute:#6b7a88;--line:#d9e0e8;--g:#0e8f6b;--r:#d2453d;--ac:#2a5bd7;--up:var(--g);--dn:var(--r);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--card:#171f28;--ink:#e6edf4;--mute:#8a9aa9;--line:#27323f;--g:#2ebd85;--r:#f6465d;--ac:#7aa2ff}}
:root[data-theme="dark"]{--bg:#0e1319;--card:#171f28;--ink:#e6edf4;--mute:#8a9aa9;--line:#27323f;--g:#2ebd85;--r:#f6465d;--ac:#7aa2ff}
:root[data-rg="1"]{--up:var(--r);--dn:var(--g)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:960px;margin:0 auto;padding:10px 16px 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.top b{font-size:20px;font-variant-numeric:tabular-nums}
nav{max-width:960px;margin:0 auto;display:flex;overflow-x:auto}
nav button{flex:1;padding:12px 10px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ac);font-weight:700}
main{max-width:960px;margin:0 auto;padding:14px 16px 90px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:13px;margin:16px 0 6px;color:var(--mute);font-weight:500}
.sub{color:var(--mute);font-size:13px}
.r{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
svg#ch{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:8px}
.b{flex:1;padding:10px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;color:#fff}
.buy{background:var(--up)}.sell{background:var(--dn)}.wd{background:var(--ac)}
.q{padding:8px 12px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.asset{border-bottom:1px solid var(--line);padding:12px 0}.asset:last-child{border:0}
.ah{display:flex;justify-content:space-between;gap:10px}
.ctl{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat small{color:var(--mute);display:block}.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.set{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dng{background:none;border:1px solid var(--dn);color:var(--dn);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#msg.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top"><span><span class="sub" data-i="total"></span> <b id="hTot"></b></span><span class="sub"><span data-i="withdrawn"></span>: <b id="hWd"></b></span></div>
  <nav id="nav">
    <button data-t="chart" class="on" data-i="chart"></button>
    <button data-t="inv" data-i="inv"></button>
    <button data-t="wallet" data-i="wallet"></button>
    <button data-t="set" data-i="set"></button>
  </nav>
</header>
<main>
<section id="s-chart" class="on">
  <div class="grid">
    <div class="card">
      <div class="chips" id="chips"></div>
      <div class="ah"><h2 id="cTitle"></h2><div class="r"><b id="cPrice"></b><div class="sub" id="cHave"></div></div></div>
      <svg id="ch" viewBox="0 0 640 320"></svg>
    </div>
    <div class="card">
      <h2 data-i="wdTitle" style="margin-bottom:4px"></h2>
      <div style="margin:8px 0;line-height:1.7"><div><span class="sub" data-i="avail"></span>: <b id="wdCash"></b></div><div><span class="sub" data-i="inInv"></span>: <b id="wdInv"></b></div><div><span class="sub" data-i="after"></span>: <b id="after"></b></div></div>
      <h3 data-i="toAssetsT"></h3><input id="tamt" type="number" min="0" step="any" inputmode="decimal" data-ip="amount">
      <div class="row"><button class="b buy" id="toA" data-i="toAssets"></button><button class="q" id="tall" data-i="all"></button></div>
      <div class="sub" style="margin-top:6px" data-i="toHint"></div>
      <h3 data-i="toWalletT"></h3>
      <input id="wamt" type="number" min="0" step="any" inputmode="decimal" data-ip="amount">
      <div class="row"><button class="b wd" id="wd" data-i="wdBtn"></button><button class="q" id="wall" data-i="all"></button></div>
      <div class="row"><button class="q" id="back" style="flex:1" data-i="back"></button></div>
      <p class="sub" data-i="wdHint"></p>
    </div>
  </div>
</section>
<section id="s-inv"><div class="card"><span data-i="cash"></span>: <b id="iCash"></b> &nbsp; <span class="sub"><span data-i="withdrawn"></span>: <b id="iWd"></b></span></div><div class="card" id="invList"></div></section>
<section id="s-wallet">
  <div class="stats">
    <div class="stat"><small data-i="invested"></small><b id="wInv"></b></div>
    <div class="stat"><small data-i="total"></small><b id="wTot"></b></div>
    <div class="stat"><small data-i="withdrawn"></small><b id="wWd"></b></div>
    <div class="stat"><small data-i="capital"></small><b id="wCap"></b></div>
  </div>
  <div class="card" style="margin-top:14px"><h2 data-i="log"></h2><div class="log" id="log"></div></div>
</section>
<section id="s-set"><div class="card">
  <div class="set"><label for="sLang" data-i="lang"></label><select id="sLang"><option value="uk">Українська</option><option value="en">English</option></select></div>
  <div class="set"><label for="sTheme" data-i="theme"></label><select id="sTheme"><option value="auto" data-i="tAuto"></option><option value="light" data-i="tLight"></option><option value="dark" data-i="tDark"></option></select></div>
  <div class="set"><label for="sTf" data-i="tf"></label><select id="sTf"><option value="5">5 s</option><option value="15">15 s</option><option value="30">30 s</option></select></div>
  <div class="set"><label for="sRg" data-i="colors"></label><select id="sRg"><option value="0" data-i="gUp"></option><option value="1" data-i="rUp"></option></select></div>
  <div class="set"><span data-i="resetT"></span><button class="dng" id="reset" data-i="resetB"></button></div>
</div></section>
</main>
<div id="msg" role="status"></div>
<script>
(()=>{'use strict';
const D={uk:{total:'Усього активів',chart:'Графік',inv:'Інвестиції',wallet:'Гаманець',set:'Налаштування',wdTitle:'Вивести на гаманець',wdBtn:'Вивести',all:'Усе',wdHint:'Виводити можна готівку. «Усього активів» — це готівка, вона не змінюється від цін. Гроші в інвестиціях зростають або падають, доки ви їх не продасте. Виведене лежить у «Виведено» і його можна повернути.',eHint:'Частину коштів виведено: поверніть їх у гру на вкладці «Графік».',avail:'Доступно для виведення',toAssetsT:'1. З інвестицій в активи',toWalletT:'2. З активів на гаманець',toAssets:'Перевести в активи',toHint:'Інвестиції продаються пропорційно за поточною ціною.',oToA:'Переведено в активи',eInv:'В інвестиціях лише',inInv:'В інвестиціях (ціна змінюється)',after:'Після виведення залишиться',capital:'Капітал з виведеним',back:'Повернути в гру',eWd:'На гаманці немає стільки коштів.',oBack:'Повернено в гру',amount:'Сума в $',cash:'Готівка',invested:'У інвестиціях',withdrawn:'Виведено',log:'Історія операцій',noLog:'Поки що порожньо.',lang:'Мова',theme:'Тема екрана',tAuto:'Авто',tLight:'Світла',tDark:'Темна',tf:'Одна свічка',colors:'Кольори графіка',gUp:'Зелений — ріст',rUp:'Червоний — ріст',resetT:'Почати гру спочатку',resetB:'Скинути',confirm:'Скинути гру і почати з $1000?',buy:'Купити',sell:'Продати',crypto:'Криптовалюти',firms:'Компанії',own:'У вас',noInv:'Ви ще нічого не купили. Оберіть актив і купіть його в розділі «Інвестиції».',eAmt:'Введіть суму більше нуля.',eCash:'Недостатньо готівки.',eHave:'У вас менше цього активу.',oBuy:'Куплено',oSell:'Продано',oWd:'Виведено',rst:'Гру скинуто.',cur:'Поточний вибір'},
en:{total:'Total assets',chart:'Chart',inv:'Investments',wallet:'Wallet',set:'Settings',wdTitle:'Withdraw to wallet',wdBtn:'Withdraw',all:'All',wdHint:'You can withdraw cash. Total assets is your cash and does not move with prices. Money in investments rises or falls until you sell it. Withdrawn funds stay under Withdrawn and can be moved back.',eHint:'Some funds were withdrawn: move them back in the Chart tab.',avail:'Available to withdraw',toAssetsT:'1. From investments to assets',toWalletT:'2. From assets to wallet',toAssets:'Move to assets',toHint:'Investments are sold proportionally at the current price.',oToA:'Moved to assets',eInv:'Only invested:',inInv:'In investments (price changes)',after:'Left after withdrawal',capital:'Capital incl. withdrawn',back:'Move back to game',eWd:'Not enough funds in the wallet.',oBack:'Moved back',amount:'Amount in $',cash:'Cash',invested:'In investments',withdrawn:'Withdrawn',log:'Activity',noLog:'Nothing yet.',lang:'Language',theme:'Screen theme',tAuto:'Auto',tLight:'Light',tDark:'Dark',tf:'One candle',colors:'Chart colors',gUp:'Green — up',rUp:'Red — up',resetT:'Start the game over',resetB:'Reset',confirm:'Reset the game and start with $1000?',buy:'Buy',sell:'Sell',crypto:'Cryptocurrencies',firms:'Companies',own:'You hold',noInv:'You have not bought anything yet. Pick an asset in the Investments tab.',eAmt:'Enter an amount above zero.',eCash:'Not enough cash.',eHave:'You hold less of this asset.',oBuy:'Bought',oSell:'Sold',oWd:'Withdrew',rst:'Game reset.',cur:'Current'}};
const A=[
{id:'BTC',n:'Bitcoin',g:'c',p:60000,v:.012},{id:'ETH',n:'Ethereum',g:'c',p:3000,v:.016},{id:'SOL',n:'Solana',g:'c',p:140,v:.024},{id:'DOGE',n:'Dogecoin',g:'c',p:.15,v:.035},
{id:'NMN',n:'Nova Mining',g:'k',p:42,v:.014},{id:'CHP',n:'ChainPay',g:'k',p:128,v:.01},{id:'ORX',n:'Orbit Exchange',g:'k',p:76,v:.013},{id:'BLF',n:'BlockForge',g:'k',p:19,v:.02},{id:'LMW',n:'Lumen Wallet',g:'k',p:55,v:.011},{id:'ATC',n:'Atlas Capital',g:'k',p:210,v:.008}];
const $=i=>document.getElementById(i);
const fm=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fp=p=>p<1?'$'+p.toFixed(4):fm(p);
function fresh(){const q={},m={};A.forEach(a=>{q[a.id]=0;let p=a.p,c=[];for(let i=0;i<40;i++){const o=p;let h=p,l=p;for(let k=0;k<5;k++){p*=1+(Math.random()-.495)*a.v;h=Math.max(h,p);l=Math.min(l,p)}c.push({o,h,l,c:p})}m[a.id]={p,c,cur:{o:p,h:p,l:p,c:p},n:0}});return{cash:1000,wd:0,q,m,log:[],set:{lang:'en',theme:'auto',tf:5,rg:0}}}
function hs(x){let a=0xdeadbeef,b=0x41c6ce57;const z=x+'|k9#sandbox';for(let i=0;i<z.length;i++){const c=z.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
let S;try{const raw=localStorage.getItem('ig1');if(raw&&localStorage.getItem('ig1h')===hs(raw))S=JSON.parse(raw)}catch(e){}
if(!S||!S.m||!Number.isFinite(S.cash)||S.cash<0||!Number.isFinite(S.wd)||S.wd<0)S=fresh();
if(!S.set.li){S.set.lang='en';S.set.li=1}
const save=()=>{try{const raw=JSON.stringify(S);localStorage.setItem('ig1',raw);localStorage.setItem('ig1h',hs(raw))}catch(e){}};
const t=k=>D[S.set.lang][k]||k;
let tab='chart',sel='BTC';
const val=()=>A.reduce((s,a)=>s+S.q[a.id]*S.m[a.id].p,0);
let tm;function toast(x){const m=$('msg');m.textContent=x;m.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>m.classList.remove('show'),2500)}
function log(x){S.log.unshift(new Date().toLocaleTimeString(S.set.lang,{hour:'2-digit',minute:'2-digit'})+' · '+x);S.log=S.log.slice(0,50)}
function owned(){return A.filter(a=>S.q[a.id]>0)}
function chips(){const o=owned(),l=o.length?o:A;if(!l.find(a=>a.id===sel))sel=l[0].id;
  $('chips').innerHTML=l.map(a=>`<button class="chip ${a.id===sel?'on':''}" data-id="${a.id}">${a.id}</button>`).join('')+(o.length?'':`<span class="sub" style="align-self:center">${t('noInv')}</span>`)}
function chart(){const a=A.find(x=>x.id===sel),s=S.m[sel],cs=[...s.c.slice(-39),s.cur];
  let mn=Math.min(...cs.map(c=>c.l)),mx=Math.max(...cs.map(c=>c.h));const pd=(mx-mn)*.1||mx*.01;mn-=pd;mx+=pd;
  const W=640,H=320,R=70,cw=(W-R)/cs.length,y=v=>H-(v-mn)/(mx-mn)*H;let g='';
  for(let i=1;i<5;i++){const v=mn+(mx-mn)*i/5,yy=y(v);g+=`<line x1="0" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${W-R+6}" y="${yy+4}" font-size="11" fill="var(--mute)">${fp(v)}</text>`}
  cs.forEach((c,i)=>{const x=i*cw+cw/2,up=c.c>=c.o,col=up?'var(--up)':'var(--dn)',top=y(Math.max(c.o,c.c)),bh=Math.max(1,Math.abs(y(c.o)-y(c.c)));
    g+=`<line x1="${x}" x2="${x}" y1="${y(c.h)}" y2="${y(c.l)}" stroke="${col}"/><rect x="${x-cw*.35}" y="${top}" width="${cw*.7}" height="${bh}" fill="${col}"/>`});
  const ly=y(s.p),lc=s.cur.c>=s.cur.o?'var(--up)':'var(--dn)';
  g+=`<line x1="0" x2="${W-R}" y1="${ly}" y2="${ly}" stroke="${lc}" stroke-dasharray="4 3"/><rect x="${W-R}" y="${ly-9}" width="${R}" height="18" fill="${lc}"/><text x="${W-R+5}" y="${ly+4}" font-size="11" fill="#fff">${fp(s.p)}</text>`;
  $('ch').innerHTML=g;$('cTitle').textContent=a.n+' · '+a.id;$('cPrice').textContent=fp(s.p);
  $('cHave').textContent=S.q[sel]>0?`${t('own')}: ${S.q[sel].toFixed(6)} ≈ ${fm(S.q[sel]*s.p)}`:''}
function stats(){const v=val(),T=fm(S.cash);$('hTot').textContent=T;$('wTot').textContent=T;$('wInv').textContent=fm(v);$('wWd').textContent=fm(S.wd);$('hWd').textContent=fm(S.wd);$('iCash').textContent=fm(S.cash);$('iWd').textContent=fm(S.wd);$('wCap').textContent=fm(S.cash+v+S.wd);$('wdCash').textContent=fm(S.cash);$('wdInv').textContent=fm(v);prev()}
function logv(){$('log').innerHTML=S.log.length?S.log.map(l=>`<div>${l}</div>`).join(''):`<div class="sub">${t('noLog')}</div>`}
function invBuild(){const grp=(g,n)=>`<h3>${t(n)}</h3>`+A.filter(a=>a.g===g).map(a=>`<div class="asset"><div class="ah"><div><b>${a.n}</b> <span class="sub">${a.id}</span><div class="sub" id="o-${a.id}"></div></div><div class="r"><b id="p-${a.id}"></b><div id="c-${a.id}"></div></div></div><div class="ctl"><input type="number" min="0" step="any" inputmode="decimal" id="i-${a.id}" placeholder="${t('amount')}"><button class="b buy" data-a="buy" data-id="${a.id}">${t('buy')}</button><button class="b sell" data-a="sell" data-id="${a.id}">${t('sell')}</button></div></div>`).join('');
  $('invList').innerHTML=grp('c','crypto')+grp('k','firms');invLive()}
function invLive(){A.forEach(a=>{const s=S.m[a.id],ch=(s.p/s.c[0].o-1)*100;$('p-'+a.id).textContent=fp(s.p);const e=$('c-'+a.id);e.textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';e.className=ch>=0?'up':'dn';
  $('o-'+a.id).textContent=S.q[a.id]>0?`${t('own')}: ${S.q[a.id].toFixed(6)} ≈ ${fm(S.q[a.id]*s.p)}`:''})}
function prev(){const v=parseFloat($('wamt').value)||0;$('after').textContent=fm(Math.max(0,S.cash-v))}
function live(){stats();if(tab==='chart')chart();if(tab==='inv')invLive()}
function tick(){A.forEach(a=>{const s=S.m[a.id];s.p=Math.max(s.p*(1+(Math.random()-.495)*a.v),a.p*.02);const c=s.cur;c.c=s.p;c.h=Math.max(c.h,s.p);c.l=Math.min(c.l,s.p);
  if(++s.n>=S.set.tf){s.c.push({...c});if(s.c.length>60)s.c.shift();s.cur={o:s.p,h:s.p,l:s.p,c:s.p};s.n=0}});save();live()}
function lang(){document.documentElement.lang=S.set.lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=t(e.dataset.ip));
  document.title=S.set.lang==='uk'?'Інвест-пісочниця':'Invest Sandbox';invBuild();chips();logv();live()}
function theme(){const r=document.documentElement;S.set.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.set.theme;r.dataset.rg=S.set.rg}
function show(n){tab=n;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+n));if(n==='chart')chips();if(n==='wallet')logv();live()}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){sel=b.dataset.id;chips();chart()}};
$('invList').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.id,inp=$('i-'+id),v=parseFloat(inp.value);
  if(!(v>0&&isFinite(v)))return toast(t('eAmt'));const s=S.m[id];
  if(b.dataset.a==='buy'){if(v>S.cash+1e-9)return toast(`${t('eCash')} ${t('cash')}: ${fm(S.cash)}.`+(S.wd>0?` ${t('eHint')}`:''));S.cash-=v;S.q[id]+=v/s.p;log(`${t('oBuy')} ${id}: ${fm(v)}`);toast(`${t('oBuy')} ${id}: ${fm(v)}`)}
  else{if(v>S.q[id]*s.p+1e-9)return toast(t('eHave'));S.q[id]=Math.max(0,S.q[id]-v/s.p);if(S.q[id]*s.p<.005)S.q[id]=0;S.cash+=v;log(`${t('oSell')} ${id}: ${fm(v)}`);toast(`${t('oSell')} ${id}: ${fm(v)}`)}
  inp.value='';save();live()};
$('tall').onclick=()=>{$('tamt').value=val().toFixed(2)};
$('toA').onclick=()=>{const v=parseFloat($('tamt').value);if(!(v>0&&isFinite(v)))return toast(t('eAmt'));const inv=val();if(v>inv+1e-9)return toast(`${t('eInv')} ${fm(inv)}.`);const f=Math.min(1,v/inv);A.forEach(a=>{S.q[a.id]*=1-f;if(S.q[a.id]*S.m[a.id].p<.005)S.q[a.id]=0});S.cash+=v;log(`${t('oToA')}: ${fm(v)}`);toast(`${t('oToA')}: ${fm(v)}`);$('tamt').value='';save();chips();live()};
$('wall').onclick=()=>{$('wamt').value=S.cash.toFixed(2);prev()};$('wamt').oninput=prev;
$('wd').onclick=()=>{const v=parseFloat($('wamt').value);if(!(v>0&&isFinite(v)))return toast(t('eAmt'));if(v>S.cash+1e-9)return toast(t('eCash'));S.cash-=v;S.wd+=v;log(`${t('oWd')}: ${fm(v)}`);toast(`${t('oWd')}: ${fm(v)} → ${t('wallet')}`);$('wamt').value='';save();live()};
$('back').onclick=()=>{const v=parseFloat($('wamt').value);if(!(v>0&&isFinite(v)))return toast(t('eAmt'));if(v>S.wd+1e-9)return toast(t('eWd'));S.wd-=v;S.cash+=v;log(`${t('oBack')}: ${fm(v)}`);toast(`${t('oBack')}: ${fm(v)}`);$('wamt').value='';save();live()};
$('sLang').onchange=e=>{S.set.lang=e.target.value;save();lang()};
$('sTheme').onchange=e=>{S.set.theme=e.target.value;save();theme()};
$('sTf').onchange=e=>{S.set.tf=+e.target.value;save()};
$('sRg').onchange=e=>{S.set.rg=+e.target.value;save();theme()};
$('reset').onclick=()=>{if(confirm(t('confirm'))){const st=S.set;S=fresh();S.set=st;save();sel='BTC';lang();toast(t('rst'))}};
$('sLang').value=S.set.lang;$('sTheme').value=S.set.theme;$('sTf').value=S.set.tf;$('sRg').value=S.set.rg;
theme();lang();setInterval(tick,1000);
})();
</script>

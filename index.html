<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invest Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
#auth{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#auth.on{display:flex}#auth .card{width:100%;max-width:380px;margin:0}
:root{--bg:#eef1f5;--card:#fff;--ink:#14212b;--mute:#6b7a88;--line:#d9e0e8;--g:#0e8f6b;--r:#d2453d;--ac:#2a5bd7;--up:var(--g);--dn:var(--r);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--card:#171f28;--ink:#e6edf4;--mute:#8a9aa9;--line:#27323f;--g:#2ebd85;--r:#f6465d;--ac:#7aa2ff}}
:root[data-theme="dark"]{--bg:#0e1319;--card:#171f28;--ink:#e6edf4;--mute:#8a9aa9;--line:#27323f;--g:#2ebd85;--r:#f6465d;--ac:#7aa2ff}
:root[data-rg="1"]{--up:var(--r);--dn:var(--g)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:960px;margin:0 auto;padding:10px 16px 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.top b{font-size:20px;font-variant-numeric:tabular-nums}
nav{max-width:960px;margin:0 auto;display:flex;overflow-x:auto}
nav button{flex:1;padding:12px 10px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ac);font-weight:700}
main{max-width:960px;margin:0 auto;padding:14px 16px 90px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:13px;margin:16px 0 6px;color:var(--mute);font-weight:500}
.sub{color:var(--mute);font-size:13px}
.r{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
svg#ch{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:8px}
.b{flex:1;padding:10px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;color:#fff}
.buy{background:var(--up)}.sell{background:var(--dn)}.wd{background:var(--ac)}
.q{padding:8px 12px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.asset{border-bottom:1px solid var(--line);padding:12px 0}.asset:last-child{border:0}
.ah{display:flex;justify-content:space-between;gap:10px}
.ctl{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat small{color:var(--mute);display:block}.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.set{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mk{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}@media(max-width:560px){.mk{grid-template-columns:1fr}}

#msg.show{opacity:1}
</style>
</head>

      <div class="row"><button class="q" id="back" style="flex:1" data-i="back"></button></div>

</section>
<section id="s-inv"><div class="card"><span data-i="cash"></span>: <b id="iCash"></b> &nbsp; <span class="sub"><span data-i="withdrawn"></span>: <b id="iWd"></b></span></div><div class="card"><h2 data-i="newCoin"></h2>

  <div class="row"><button class="b wd" id="mkBtn" data-i="cBtn"></button></div><div class="sub" style="margin-top:6px" data-i="cHint"></div></div>

<section id="s-wallet">

    <div class="stat"><small data-i="invested"></small><b id="wInv"></b></div>
    <div class="stat"><small data-i="total"></small><b id="wTot"></b></div>
    <div class="stat"><small data-i="withdrawn"></small><b id="wWd"></b></div>
    <div class="stat"><small data-i="capital"></small><b id="wCap"></b></div>
  </div>
  <div class="card" style="margin-top:14px"><h2 data-i="lb"></h2><div class="log" id="lb"></div></div>
  <div class="card"><h2 data-i="log"></h2><div class="log" id="log"></div></div>
</section>
<section id="s-set"><div class="card">
  <div class="set"><label for="sLang" data-i="lang"></label><select id="sLang"><option value="uk">Українська</option><option value="en">English</option></select></div>
  <div class="set"><label for="sTheme" data-i="theme"></label><select id="sTheme"><option value="auto" data-i="tAuto"></option><option value="light" data-i="tLight"></option><option value="dark" data-i="tDark"></option></select></div>
  <div class="set"><label for="sTf" data-i="tf"></label><select id="sTf"><option value="5">5 s</option><option value="15">15 s</option><option value="30">30 s</option></select></div>
  <div class="set"><label for="sRg" data-i="colors"></label><select id="sRg"><option value="0" data-i="gUp"></option><option value="1" data-i="rUp"></option></select></div>
  <div class="set"><span><span class="sub" data-i="who"></span>: <b id="who"></b></span><button class="dng" id="out" data-i="signOut"></button></div>
  <div class="set"><span data-i="resetT"></span><button class="dng" id="reset" data-i="resetB"></button></div>
</div></section>
</main>
<div id="msg" role="status"></div>
<script>
(()=>{'use strict';
const sb=supabase.createClient('https://ntvtguzyaexclvmaqxxs.supabase.co','sb_publishable_OkdcjL4hqtlC8L3GVP9bEA_vzIhwZzG');
const D={uk:{signIn:'Увійти',signUp:'Реєстрація',signOut:'Вийти',email:'Email',password:'Пароль (від 6 символів)',lb:'Таблиця рекордів',checkMail:'Перевірте пошту й підтвердьте email, потім увійдіть.',who:'Акаунт',total:'Усього активів',chart:'Графік',inv:'Інвестиції',wallet:'Гаманець',set:'Налаштування',wdTitle:'Вивести на гаманець',wdBtn:'Вивести',all:'Усе',wdHint:'Виводити можна готівку. «Усього активів» — це готівка, вона не змінюється від цін. Гроші в інвестиціях зростають або падають, доки ви їх не продасте. Виведене лежить у «Виведено» і його можна повернути.',amount:'Сума в $',cash:'Готівка',invested:'У інвестиціях',withdrawn:'Виведено',log:'Історія операцій',noLog:'Поки що порожньо.',lang:'Мова',theme:'Тема екрана',tAuto:'Авто',tLight:'Світла',tDark:'Темна',tf:'Одна свічка',colors:'Кольори графіка',gUp:'Зелений — ріст',rUp:'Червоний — ріст',resetT:'Почати гру спочатку',resetB:'Скинути',confirm:'Скинути гру і почати з $1000?',buy:'Купити',sell:'Продати',crypto:'Криптовалюти',firms:'Компанії',user:'Монети гравців',own:'У вас',noInv:'Ви ще нічого не купили. Оберіть актив і купіть його в розділі «Інвестиції».',eAmt:'Введіть суму більше нуля.',eCash:'Недостатньо готівки.',eHave:'У вас менше цього активу.',oBuy:'Куплено',oSell:'Продано',oWd:'Виведено',rst:'Гру скинуто.',eHint:'Частину коштів виведено: поверніть їх у гру на вкладці «Графік».',capital:'Капітал з виведеним',back:'Повернути в гру',eWd:'На гаманці немає стільки коштів.',oBack:'Повернено в гру',avail:'Доступно для виведення',toAssetsT:'1. З інвестицій в активи',toWalletT:'2. З активів на гаманець',toAssets:'Перевести в активи',toHint:'Інвестиції продаються пропорційно за поточною ціною.',oToA:'Переведено в активи',eInv:'В інвестиціях лише',inInv:'В інвестиціях (ціна змінюється)',after:'Після виведення залишиться',newCoin:'Створити свою монету',cName:'Назва',cTicker:'Тікер (2–5)',cPrice:'Стартова ціна $',cBtn:'Створити за $50',cHint:'Монету побачать усі гравці. Графік у всіх однаковий.',eName:'Назва: 2–20 символів.',eTick:'Тікер: 2–5 літер чи цифр, і він має бути вільним.',ePrice:'Ціна від 0.01 до 1000.',eNoDb:'Спільний сервер недоступний (потрібен вхід у claude.ai і право редагування).',oMk:'Монету створено',by:'від',you:'вас',online:'Онлайн',offline:'Лише ціни'},
en:{signIn:'Sign In',signUp:'Sign Up',signOut:'Sign Out',email:'Email',password:'Password (6+ characters)',lb:'Leaderboard',checkMail:'Check your email and confirm it, then sign in.',who:'Account',total:'Total assets',chart:'Chart',inv:'Investments',wallet:'Wallet',set:'Settings',wdTitle:'Withdraw to wallet',wdBtn:'Withdraw',all:'All',wdHint:'You can withdraw cash. Total assets is your cash and does not move with prices. Money in investments rises or falls until you sell it. Withdrawn funds stay under Withdrawn and can be moved back.',amount:'Amount in $',cash:'Cash',invested:'In investments',withdrawn:'Withdrawn',log:'Activity',noLog:'Nothing yet.',lang:'Language',theme:'Screen theme',tAuto:'Auto',tLight:'Light',tDark:'Dark',tf:'One candle',colors:'Chart colors',gUp:'Green — up',rUp:'Red — up',resetT:'Start the game over',resetB:'Reset',confirm:'Reset the game and start with $1000?',buy:'Buy',sell:'Sell',crypto:'Cryptocurrencies',firms:'Companies',user:'Player coins',own:'You hold',noInv:'You have not bought anything yet. Pick an asset in the Investments tab.',eAmt:'Enter an amount above zero.',eCash:'Not enough cash.',eHave:'You hold less of this asset.',oBuy:'Bought',oSell:'Sold',oWd:'Withdrew',rst:'Game reset.',eHint:'Some funds were withdrawn: move them back in the Chart tab.',capital:'Capital incl. withdrawn',back:'Move back to game',eWd:'Not enough funds in the wallet.',oBack:'Moved back',avail:'Available to withdraw',toAssetsT:'1. From investments to assets',toWalletT:'2. From assets to wallet',toAssets:'Move to assets',toHint:'Investments are sold proportionally at the current price.',oToA:'Moved to assets',eInv:'Only invested:',inInv:'In investments (price changes)',after:'Left after withdrawal',newCoin:'Create your own coin',cName:'Name',cTicker:'Ticker (2–5)',cPrice:'Start price $',cBtn:'Create for $50',cHint:'Every player will see your coin. Everyone sees the same chart.',eName:'Name: 2–20 characters.',eTick:'Ticker: 2–5 letters or digits, and it must be free.',ePrice:'Price from 0.01 to 1000.',eNoDb:'Shared server unavailable (sign in to claude.ai with edit access).',oMk:'Coin created',by:'by',you:'you',online:'Online',offline:'Prices only'}};
const $=i=>document.getElementById(i);
const esc=x=>String(x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fm=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fp=p=>p<1?'$'+p.toFixed(4):fm(p);
let ST={lang:'en',theme:'auto',tf:5,rg:0};try{Object.assign(ST,JSON.parse(localStorage.getItem('ig2s')))}catch(e){}
const saveS=()=>{try{localStorage.setItem('ig2s',JSON.stringify(ST))}catch(e){}};
const t=k=>D[ST.lang][k]||k;
let AL=[],P={cash:0,wd:0},H={},LOG=[],USER=null,tab='chart',sel='BTC';
const Q=id=>H[id]||0;
/* Same price formula as the server (price_at in SQL) */
const FQ=[.0003,.0011,.0047,.021,.09,.35,1.3,2.9],AM=[.5,.35,.25,.18,.12,.08,.05,.04];
function pr(a,t){let x=0;for(let i=0;i<8;i++)x+=AM[i]*Math.sin(FQ[i]*t+a.ph[i]);return Math.max(a.p*.02,a.p*Math.exp(a.v*8*x))}
const now=()=>Math.floor(Date.now()/1000);
const px=a=>pr(a,now());
function cndl(a,tf,n){const nw=now(),end=nw-nw%tf,out=[];for(let i=n-1;i>=0;i--){const st=end-i*tf,last=Math.min(st+tf-1,nw);let o=pr(a,st-1),c=pr(a,st),h=Math.max(o,c),l=Math.min(o,c);for(let k=st+1;k<=last;k++){c=pr(a,k);h=Math.max(h,c);l=Math.min(l,c)}out.push({o,h,l,c})}return out}
const val=()=>AL.reduce((s,a)=>s+Q(a.id)*px(a),0);
let tm;function toast(x){const m=$('msg');m.textContent=x;m.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>m.classList.remove('show'),3500)}
function log(x){LOG.unshift(new Date().toLocaleTimeString(ST.lang,{hour:'2-digit',minute:'2-digit'})+' · '+x);LOG=LOG.slice(0,50)}
const owned=()=>AL.filter(a=>Q(a.id)>0);
function em(m){m=m||'';return m.includes('not enough cash')?t('eCash'):m.includes('not enough asset')?t('eHave'):m.includes('not enough invested')?t('eInv'):m.includes('not enough in wallet')?t('eWd'):m.includes('ticker')?t('eTick'):m.includes('bad name')?t('eName'):m.includes('bad price')?t('ePrice'):m}
async function call(name,args,ok){const{error}=await sb.rpc(name,args);if(error){toast(em(error.message));return false}await refresh();if(ok){log(ok);toast(ok)}return true}
function chips(){if(!AL.length)return;const o=owned(),l=o.length?o:AL;if(!l.find(a=>a.id===sel))sel=l[0].id;
  $('chips').innerHTML=l.map(a=>`<button class="chip ${a.id===sel?'on':''}" data-id="${esc(a.id)}">${esc(a.id)}</button>`).join('')+(o.length?'':`<span class="sub" style="align-self:center">${t('noInv')}</span>`)}
function chart(){const a=AL.find(x=>x.id===sel);if(!a)return;const cs=cndl(a,ST.tf,40),p=cs[cs.length-1].c;
  let mn=Math.min(...cs.map(c=>c.l)),mx=Math.max(...cs.map(c=>c.h));const pd=(mx-mn)*.1||mx*.01;mn-=pd;mx+=pd;
  const W=640,H2=320,R=70,cw=(W-R)/cs.length,y=v=>H2-(v-mn)/(mx-mn)*H2;let g='';
  for(let i=1;i<5;i++){const v=mn+(mx-mn)*i/5,yy=y(v);g+=`<line x1="0" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${W-R+6}" y="${yy+4}" font-size="11" fill="var(--mute)">${fp(v)}</text>`}
  cs.forEach((c,i)=>{const x=i*cw+cw/2,up=c.c>=c.o,col=up?'var(--up)':'var(--dn)',top=y(Math.max(c.o,c.c)),bh=Math.max(1,Math.abs(y(c.o)-y(c.c)));
    g+=`<line x1="${x}" x2="${x}" y1="${y(c.h)}" y2="${y(c.l)}" stroke="${col}"/><rect x="${x-cw*.4}" y="${top}" width="${cw*.8}" height="${bh}" fill="${col}"/>`});
  const ly=y(p),k=cs[cs.length-1],lc=k.c>=k.o?'var(--up)':'var(--dn)';
  g+=`<line x1="0" x2="${W-R}" y1="${ly}" y2="${ly}" stroke="${lc}" stroke-dasharray="4 3"/><rect x="${W-R}" y="${ly-9}" width="${R}" height="18" fill="${lc}"/><text x="${W-R+5}" y="${ly+4}" font-size="11" fill="#fff">${fp(p)}</text>`;
  $('ch').innerHTML=g;$('cTitle').textContent=a.n+' · '+a.id;$('cPrice').textContent=fp(p);
  $('cHave').textContent=Q(sel)>0?`${t('own')}: ${Q(sel).toFixed(6)} ≈ ${fm(Q(sel)*p)}`:''}

function stats(){const v=val(),T=fm(P.cash);$('hTot').textContent=T;$('wTot').textContent=T;$('wInv').textContent=fm(v);$('wWd').textContent=fm(P.wd);$('hWd').textContent=fm(P.wd);$('iCash').textContent=fm(P.cash);$('iWd').textContent=fm(P.wd);$('wCap').textContent=fm(P.cash+v+P.wd);$('wdCash').textContent=fm(P.cash);$('wdInv').textContent=fm(v);prev();$('net').textContent='● Online'}
function logv(){$('log').innerHTML=LOG.length?LOG.map(l=>`<div>${esc(l)}</div>`).join(''):`<div class="sub">${t('noLog')}</div>`}
async function lb(){const{data}=await sb.rpc('leaderboard');$('lb').innerHTML=(data||[]).map((r,i)=>`<div>${i+1}. ${esc(r.name)} — <b>${fm(+r.total)}</b></div>`).join('')}
function invBuild(){const grp=(g,n)=>{const l=AL.filter(a=>a.g===g);return l.length?`<h3>${t(n)}</h3>`+l.map(a=>`<div class="asset"><div class="ah"><div><b>${esc(a.n)}</b> <span class="sub">${esc(a.id)}</span><div class="sub" id="o-${esc(a.id)}"></div></div><div class="r"><b id="p-${esc(a.id)}"></b><div id="c-${esc(a.id)}"></div></div></div><div class="ctl"><input type="number" min="0" step="any" inputmode="decimal" id="i-${esc(a.id)}" placeholder="${t('amount')}"><button class="b buy" data-a="buy" data-id="${esc(a.id)}">${t('buy')}</button><button class="b sell" data-a="sell" data-id="${esc(a.id)}">${t('sell')}</button></div></div>`).join(''):''};
  $('invList').innerHTML=grp('c','crypto')+grp('k','firms')+grp('u','user');invLive()}
function invLive(){const n=now();AL.forEach(a=>{const e=$('c-'+a.id);if(!e)return;const p=pr(a,n),ch=(p/pr(a,n-300)-1)*100;$('p-'+a.id).textContent=fp(p);e.textContent=(ch>=0?'+':'')+ch.toFixed(2)+'% (5m)';e.className=ch>=0?'up':'dn';
  $('o-'+a.id).textContent=Q(a.id)>0?`${t('own')}: ${Q(a.id).toFixed(6)} ≈ ${fm(Q(a.id)*p)}`:''})}
function live(){stats();if(tab==='chart')chart();if(tab==='inv')invLive()}
async function refresh(){if(!USER)return;const[a,p,h]=await Promise.all([sb.from('assets').select('*'),sb.from('profiles').select('cash,wd').maybeSingle(),sb.from('holdings').select('asset_id,qty')]);
  if(a.data){const n=AL.length;AL=a.data.map(r=>({id:r.id,n:r.name,g:r.grp,p:r.base,v:r.vol,ph:r.ph}));if(AL.length!==n||!$('invList').children.length)invBuild();chips()}
  if(p.data)P={cash:+p.data.cash,wd:+p.data.wd};
  if(h.data){H={};h.data.forEach(r=>H[r.asset_id]=+r.qty)}
  live()}
function lang(){document.documentElement.lang=ST.lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=t(e.dataset.ip));
  document.title=ST.lang==='uk'?'Інвест-пісочниця':'Invest Sandbox';invBuild();chips();logv();live()}
function theme(){const r=document.documentElement;ST.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=ST.theme;r.dataset.rg=ST.rg}
function show(n){tab=n;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));document.querySelectorAll('section').forEach(x=>x.classList.toggle('on',x.id==='s-'+n));if(n==='chart')chips();if(n==='wallet'){logv();lb()}live()}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){sel=b.dataset.id;chips();chart()}};
const num=el=>{const v=parseFloat(el.value);if(!(v>0&&isFinite(v))){toast(t('eAmt'));return null}return v};
$('invList').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.id,inp=$('i-'+id),v=num(inp);if(v==null)return;const buy=b.dataset.a==='buy';
  if(await call(buy?'buy':'sell',{aid:id,amt:v},`${t(buy?'oBuy':'oSell')} ${id}: ${fm(v)}`))inp.value=''};
$('tall').onclick=()=>{$('tamt').value=val().toFixed(2)};
$('toA').onclick=async()=>{const v=num($('tamt'));if(v!=null&&await call('to_assets',{amt:v},`${t('oToA')}: ${fm(v)}`)){$('tamt').value='';chips()}};
$('wall').onclick=()=>{$('wamt').value=P.cash.toFixed(2);prev()};$('wamt').oninput=prev;
$('wd').onclick=async()=>{const v=num($('wamt'));if(v!=null&&await call('withdraw',{amt:v},`${t('oWd')}: ${fm(v)}`))$('wamt').value=''};
$('back').onclick=async()=>{const v=num($('wamt'));if(v!=null&&await call('move_back',{amt:v},`${t('oBack')}: ${fm(v)}`))$('wamt').value=''};
$('mkBtn').onclick=async()=>{const nm=$('mkN').value.trim(),id=$('mkT').value.trim().toUpperCase(),p=parseFloat($('mkP').value);
  if(nm.length<2||nm.length>20)return toast(t('eName'));if(!/^[A-Z0-9]{2,5}$/.test(id)||AL.some(a=>a.id===id))return toast(t('eTick'));if(!(p>=.01&&p<=1000))return toast(t('ePrice'));
  if(await call('create_coin',{tkr:id,nm,startp:p},`${t('oMk')}: ${id}`))$('mkN').value=$('mkT').value=$('mkP').value=''};
$('sLang').onchange=e=>{ST.lang=e.target.value;saveS();lang()};
$('sTheme').onchange=e=>{ST.theme=e.target.value;saveS();theme()};
$('sTf').onchange=e=>{ST.tf=+e.target.value;saveS()};
$('sRg').onchange=e=>{ST.rg=+e.target.value;saveS();theme()};
$('reset').onclick=async()=>{if(confirm(t('confirm'))&&await call('reset_game',{}))toast(t('rst'))};
$('out').onclick=()=>sb.auth.signOut();
async function auth(up){const email=$('aE').value.trim(),password=$('aP').value;$('aM').textContent='';
  const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error)$('aM').textContent=r.error.message;else if(up&&!r.data.session)$('aM').textContent=t('checkMail')}
$('aIn').onclick=()=>auth(false);$('aUp').onclick=()=>auth(true);
function setUser(s){USER=s&&s.user||null;$('auth').classList.toggle('on',!USER);if(USER){$('who').textContent=USER.email;refresh()}else{H={};P={cash:0,wd:0};AL=[];$('invList').innerHTML='';LOG=[]}}
$('sLang').value=ST.lang;$('sTheme').value=ST.theme;$('sTf').value=ST.tf;$('sRg').value=ST.rg;
theme();lang();
sb.auth.getSession().then(({data})=>setUser(data.session));
sb.auth.onAuthStateChange((_e,s)=>setUser(s));
sb.channel('assets-live').on('postgres_changes',{event:'*',schema:'public',table:'assets'},()=>refresh()).subscribe();
setInterval(live,1000);setInterval(()=>{if(USER){refresh();if(tab==='wallet')lb()}},15000);
})();
</script>
</body>
</html>

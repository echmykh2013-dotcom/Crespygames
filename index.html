<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invest Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.ov{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.ov.on{display:flex}.ov .card{width:100%;max-width:380px;margin:0}
#auth{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#auth.on{display:flex}#auth .card{width:100%;max-width:380px;margin:0}
:root{--bg:#eef1f5;--card:#fff;--ink:#14212b;--mute:#6b7a88;--line:#d9e0e8;--g:#0e8f6b;--r:#d2453d;--ac:#2a5bd7;--up:var(--g);--dn:var(--r);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--card:#171f28;--ink:#e6edf4;--mute:#8a9aa9;--line:#27323f;--g:#2ebd85;--r:#f6465d;--ac:#7aa2ff}}
:root[data-theme="dark"]{--bg:#0e1319;--card:#171f28;--ink:#e6edf4;--mute:#8a9aa9;--line:#27323f;--g:#2ebd85;--r:#f6465d;--ac:#7aa2ff}
:root[data-rg="1"]{--up:var(--r);--dn:var(--g)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:960px;margin:0 auto;padding:10px 16px 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.top b{font-size:20px;font-variant-numeric:tabular-nums}
nav{max-width:960px;margin:0 auto;display:flex;overflow-x:auto}
nav button{flex:1;padding:12px 10px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ac);font-weight:700}
main{max-width:960px;margin:0 auto;padding:14px 16px 90px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:13px;margin:16px 0 6px;color:var(--mute);font-weight:500}
.sub{color:var(--mute);font-size:13px}
.r{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
svg#ch{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:8px}
.b{flex:1;padding:10px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;color:#fff}
.buy{background:var(--up)}.sell{background:var(--dn)}.wd{background:var(--ac)}
.q{padding:8px 12px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.asset{border-bottom:1px solid var(--line);padding:12px 0}.asset:last-child{border:0}
.ah{display:flex;justify-content:space-between;gap:10px}
.ctl{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat small{color:var(--mute);display:block}.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.set{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mk{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}@media(max-width:560px){.mk{grid-template-columns:1fr}}.bdg{background:var(--dn);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}.bdg:empty{display:none}
.dng{background:none;border:1px solid var(--dn);color:var(--dn);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#msg.show{opacity:1}
</style>
</head>
<body>
<div id="auth"><div class="card"><h2>Invest Sandbox</h2><input id="aE" type="email" autocomplete="email" data-ip="email"><input id="aP" type="password" autocomplete="current-password" data-ip="password" style="margin-top:8px"><div class="row"><button class="b wd" id="aIn" data-i="signIn"></button><button class="q" id="aUp" data-i="signUp"></button></div><div class="sub" id="aM" style="margin-top:8px"></div></div></div>

<header>
  <div class="top"><span><span class="sub" data-i="total"></span> <b id="hTot"></b> <button class="q" id="hTop" style="padding:2px 10px;font-size:12px;margin-left:6px" data-i="topUp"></button></span><span class="sub"><span data-i="withdrawn"></span>: <b id="hWd"></b></span><span class="sub" id="net"></span></div>

</header>

  $('aRep').innerHTML=(data||[]).length?data.map(r=>`<div class="asset"><div class="ah"><b>#${r.id}</b><span class="sub">${new Date(r.created_at).toLocaleString(ST.lang)}</span></div><div class="sub">${t('reporter')}: ${esc(r.reporter_name)} #${esc(r.reporter_pid)} → ${t('accused')}: ${esc(r.accused_name)} #${esc(r.accused_pid)}</div><div style="margin:6px 0">${esc(r.reason)}</div><div class="sub">${(r.items||[]).map(i=>esc(i.who)+': '+esc(i.asset)+' '+(+i.qty).toFixed(6)+(i.price?' @ '+fp(+i.price):'')).join('<br>')}</div><div class="row"><button class="q" data-act="dis" data-r="${r.id}">${t('dismiss')}</button><button class="b sell" data-act="banacc" data-r="${r.id}">${t('banAcc')}</button></div></div>`).join(''):`<div class="sub">${t('noReports')}</div>`}
async function adminAl(){const{data}=await sb.rpc('admin_alerts');$('aAl').innerHTML=(data||[]).map(a=>`<div>${new Date(a.at).toLocaleString(ST.lang)} · <b>${esc(a.severity)}</b> ${esc(a.reason)} — ${esc(a.name||'?')} #${esc(a.pid||'')}<br><span class="sub">${esc(JSON.stringify(a.details))}</span></div>`).join('')}
$('aGo').onclick=adminPl;
$('aPl').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;const p=b.dataset.p,a=b.dataset.act;
  if(a==='ban'){const d=$('aDays').value;if(d==='')return toast(t('needDays'));if(await rp('admin_ban',{ppid:p,days:parseInt(d),reason:$('aRsn').value},t('doneMsg')))adminPl()}
  else if(a==='unban'){if(await rp('admin_unban',{ppid:p},t('doneMsg')))adminPl()}
  else if(a==='grant'){const v=parseFloat($('aGrant').value);if(!isFinite(v)||v===0)return toast(t('eAmt'));if(await rp('admin_grant',{ppid:p,amt:v},t('doneMsg')))adminPl()}
  else if(a==='take'){const v=parseFloat($('aGrant').value);if(!(v>0))return toast(t('eAmt'));const{data,error}=await sb.rpc('admin_take',{ppid:p,amt:v,note:$('aTxt').value.trim()});if(error)return toast(em(error.message));toast(t('taken')+': $'+Number(data).toFixed(2));adminPl()}
  else if(a==='annul'){if(!confirm(t('annulQ')))return;if(await rp('admin_annul',{ppid:p,what:$('aWhat').value,note:$('aTxt').value.trim()},t('doneMsg')))adminPl()}
  else if(a==='msg'){const x=$('aTxt').value.trim();if(!x)return toast(t('msgEmpty'));if(await rp('admin_message',{ppid:p,txt:x},t('msgSent')))$('aTxt').value=''}
  else if(a==='dev'||a==='log'){inspect(p,a)}
  else if(a==='cg'){const v=parseFloat($('aGrant').value);if(!isFinite(v)||v===0)return toast(t('eAmt'));if(await rp('admin_bank_grant',{ppid:p,amt:v,note:$('aTxt').value.trim()},t('doneMsg')))adminPl()}};
$('aRep').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;const rid=+b.dataset.r,note=$('aNote').value;
  if(b.dataset.act==='dis'){if(await rp('admin_resolve_report',{rid,note},t('doneMsg'))){adminRep();adminAl()}}
  else{const d=$('aDays').value;if(d==='')return toast(t('needDays'));if(await rp('admin_resolve_report',{rid,note,ban_days:parseInt(d),ban_reason:$('aRsn').value},t('doneMsg'))){adminRep();adminAl()}}};
$('aMon').onclick=async()=>{if(await rp('admin_set_maintenance',{enabled:true,msg:$('aMsg').value},t('doneMsg')))loadSettings()};
$('aMoff').onclick=async()=>{if(await rp('admin_set_maintenance',{enabled:false,msg:''},t('doneMsg')))loadSettings()};
$('aAnnB').onclick=async()=>{if(await rp('admin_set_announcement',{txt:$('aAnn').value},t('doneMsg')))loadSettings()};


/* ===== Error screens, devices, active session ===== */
let ERR=null,NF=0,DM=null;
const netFail=m=>/failed to fetch|networkerror|network request failed|load failed|fetch failed/i.test(m||'');
function showErr(kind,extra){ERR=kind;
  const retry=()=>{hideErr();poll();refresh();ping()},out=()=>leave();
  const c={off:['📡','errOffT','errOffM',[['retry','b wd',retry]]],srv:['🛰','errSrvT','errSrvM',[['retry','b wd',retry]]],
    other:['📱','errOtherT',null,[['playHere','b wd',takeover],['signOut','q',out]]],rev:['🔒','errRevT','errRevM',[['signOut','b wd',out]]]}[kind];
  $('errI').textContent=c[0];$('errT').textContent=t(c[1]);$('errM').textContent=c[2]?t(c[2]):t('errOtherM')+(extra||'');
  const b=$('errB');b.innerHTML='';c[3].forEach(([k,cl,f])=>{const x=document.createElement('button');x.className=cl;x.style.flex='1';x.textContent=t(k);x.onclick=f;b.appendChild(x)});
  $('err').classList.add('on')}
function hideErr(){ERR=null;$('err').classList.remove('on')}
addEventListener('offline',()=>showErr('off'));
addEventListener('online',()=>{if(ERR==='off'||ERR==='srv'){hideErr();poll();refresh();ping()}});
async function leave(){try{await sb.rpc('device_leave')}catch(e){}await sb.auth.signOut()}
const dk=(()=>{try{let k=localStorage.getItem('ig_dk');if(!k){k=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());localStorage.setItem('ig_dk',k)}return k}catch(e){return 'x'+Date.now()}})();
function devInfo(){const u=navigator.userAgent;const os=/Windows/.test(u)?'Windows':/Android/.test(u)?'Android':/iPhone|iPad/.test(u)?'iOS':/Mac/.test(u)?'macOS':/Linux/.test(u)?'Linux':'?';
  let b,k='web';if(/Electron\//.test(u)){b='App';k='exe'}else if(window.Capacitor||/; wv\)/.test(u)){b='App';k='apk'}else b=/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/Firefox\//.test(u)?'Firefox':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':'Browser';
  return{n:b+' · '+os,k}}
async function ping(){if(!USER||ERR==='rev'||HALT)return;const{n,k}=devInfo();const{data,error}=await sb.rpc('device_ping',{dkey:dk,dname:n,dkind:k});
  if(error){if(netFail(error.message)&&!navigator.onLine)showErr('off');return}
  if(data&&data.error==='session revoked')return showErr('rev');
  if(data&&data.active===false)showErr('other',data.other);else if(ERR==='other'){hideErr();refresh();poll()}}
async function takeover(){const{error}=await sb.rpc('device_takeover');if(error)return toast(em(error.message));hideErr();refresh();poll()}
async function loadDevices(){const{data,error}=await sb.rpc('devices_list');if(error||!data)return;
  $('devList').innerHTML=data.map(d=>`<div class="asset"><div class="ah"><div><b>${esc(d.name)}</b>${d.is_current?` <span class="up">· ${t('thisDev')}</span>`:''}${d.is_active?` <span class="sub">· ${t('activeDev')}</span>`:''}<div class="sub">${t('lastSeen')}: ${new Date(d.last_seen).toLocaleString(ST.lang)}</div></div>${d.is_current?'':`<button class="q" data-d="${esc(d.id)}">${t('removeDev')}</button>`}</div></div>`).join('')}
$('devList').onclick=async e=>{const b=e.target.closest('[data-d]');if(!b)return;
  const f=await sb.auth.mfa.listFactors();if(!(f.data&&f.data.totp&&f.data.totp.length))return toast(t('need2fa'));
  DM=b.dataset.d;$('dmC').value='';$('dmM').textContent='';$('dm').classList.add('on')};
$('dmNo').onclick=()=>$('dm').classList.remove('on');
$('dmOk').onclick=async()=>{const f=await sb.auth.mfa.listFactors(),x=f.data&&f.data.totp&&f.data.totp[0];if(!x)return;
  const ch=await sb.auth.mfa.challenge({factorId:x.id});if(ch.error){$('dmM').textContent=ch.error.message;return}
  const v=await sb.auth.mfa.verify({factorId:x.id,challengeId:ch.data.id,code:$('dmC').value.trim()});if(v.error){$('dmM').textContent=v.error.message;return}
  const{error}=await sb.rpc('device_remove',{did:DM});$('dm').classList.remove('on');if(error)return toast(em(error.message));toast(t('devRemoved'));loadDevices()};


/* ===== Gate: ban / maintenance cannot be removed from the page ===== */
let HALT=false,GATE=null;
const GN={ban:$('ban'),maint:$('maint')};
function gate(kind){if(GATE===kind)return;GATE=kind;HALT=true;
  for(const n of ['header','main']){const e=document.querySelector(n);if(e)e.remove()}}   // під екраном бану немає ні даних, ні інтерфейсу
function guardGate(){if(!GATE)return;const el=GN[GATE];if(!document.body.contains(el)){location.reload();return}
  const c=getComputedStyle(el);if(c.display!=='flex'||c.visibility!=='visible'||Number(c.opacity)<0.9)location.reload()}
new MutationObserver(guardGate).observe(document.documentElement,{childList:true,subtree:true,attributes:true});
setInterval(guardGate,700);


/* ===== Messages from administration ===== */
async function loadMsgs(){if(!USER)return;const{data,error}=await sb.rpc('my_messages');if(error||!data)return;
  const un=data.filter(m=>!m.is_read);
  if(un.length){$('inboxL').innerHTML=un.map(m=>`<div class="asset"><div class="sub">${new Date(m.created_at).toLocaleString(ST.lang)}</div><div style="white-space:pre-wrap">${esc(m.body)}</div></div>`).join('');$('inbox').classList.add('on')}
  const pm=$('pMsgs');if(pm)pm.innerHTML=data.length?data.map(m=>`<div><span class="sub">${new Date(m.created_at).toLocaleString(ST.lang)}</span><br>${esc(m.body)}</div>`).join(''):`<div class="sub">${t('noMsgs')}</div>`}
$('inboxOk').onclick=async()=>{await sb.rpc('messages_read');$('inbox').classList.remove('on');loadMsgs()};


/* ===== Support link (Gmail) ===== */
function supLink(){const a=$('supGm');if(!a)return;const to='support@crespygames.pp.ua',body=t('supBody')+((ME&&ME.pid)||'—')+'\n'+t('supDev')+devInfo().n,subj=t('supSubj');
  a.href='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(to)+'&su='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
  const m=$('supMail');if(m)m.href='mailto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body)}


/* ===== Bank is a separate site: the button opens it ===== */
const BANK_URL='https://bank.crespygames.pp.ua';
$('hTop').onclick=()=>window.open(BANK_URL+'/?game=invest','_blank','noopener');
/* ===== Admin: devices and log of one account ===== */
let LOGP='',LOGD='',LOGROWS=[];
async function inspect(pid,what){const c=$('aInspect');c.style.display='';$('aInT').textContent='#'+pid;LOGP=pid;LOGROWS=[];$('aLogView').innerHTML='';
  const d=await sb.rpc('admin_devices',{ppid:pid});
  $('aDev').innerHTML=d.error?esc(d.error.message):((d.data||[]).map(x=>`<div class="asset"><b>${esc(x.name)}</b> <span class="sub">${esc(x.kind)}${x.is_active?' · '+t('activeDev'):''} · ${t('lastSeen')}: ${new Date(x.last_seen).toLocaleString(ST.lang)}</span></div>`).join('')||`<div class="sub">${t('aDevNone')}</div>`);
  const l=await sb.rpc('admin_log_days',{ppid:pid});
  $('aLogDays').innerHTML=(l.data||[]).map(x=>`<button class="chip" data-day="${esc(x.day)}">${esc(x.day)} (${x.n})</button>`).join('')||`<div class="sub">${t('aLogNone')}</div>`;
  if(what==='log'&&l.data&&l.data[0])openDay(l.data[0].day);
  c.scrollIntoView({behavior:'smooth'})}
async function openDay(day){const r=await sb.rpc('admin_log_view',{ppid:LOGP,d:day});if(r.error)return toast(em(r.error.message));
  LOGD=day;LOGROWS=r.data||[];
  $('aLogView').innerHTML=LOGROWS.length?LOGROWS.map(x=>`<div>${new Date(x.at).toLocaleTimeString(ST.lang)} · <b>${esc(x.action)}</b> ${x.ok?'✓':'✗ '+esc(x.error||'')}<br><span class="sub">${esc(JSON.stringify(x.args))}</span></div>`).join(''):`<div class="sub">${t('aLogNone')}</div>`}
$('aLogDays').onclick=e=>{const b=e.target.closest('[data-day]');if(b)openDay(b.dataset.day)};
$('aDl').onclick=()=>{if(!LOGROWS.length)return toast(t('aLogNone'));
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const csv='time,action,args,ok,error\n'+LOGROWS.map(x=>[x.at,x.action,JSON.stringify(x.args),x.ok,x.error||''].map(q).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='log_'+LOGP+'_'+LOGD+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};

$('sLang').value=ST.lang;$('sTheme').value=ST.theme;$('sTf').value=ST.tf;$('sRg').value=ST.rg;
theme();lang();
sb.auth.getSession().then(({data})=>setUser(data.session));
sb.auth.onAuthStateChange((_e,s)=>setUser(s));
sb.channel('assets-live').on('postgres_changes',{event:'*',schema:'public',table:'assets'},()=>refresh()).subscribe();
setInterval(live,1000);setInterval(ping,10000);setInterval(poll,2000);setInterval(()=>{loadSettings();if(USER){loadMsgs();if(HALT)refresh();else{loadDeals();loadFriends()}}},8000);setInterval(()=>{if(USER){refresh();if(tab==='wallet')lb()}},15000);
})();
</script>
